<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="shortcut icon" href="icon.png"  type="x-icon">
    <title>Stopwatch</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="wrapper">
            <p>
                <span class="mins">00</span>:<span class="seconds">00</span>:<span class="tens">00</span>
            </p>
        </div>
        <div class="buttons">
            <button class="btn-circle btn-start" title="Start"><i class="fas fa-play"></i></button>
            <button class="btn-circle btn-stop" title="Stop"><i class="fas fa-stop"></i></button>
            <button class="btn-circle btn-reset" title="Reset"><i class="fas fa-rotate-right"></i></button>
        </div>

    </div>

    <script src="script.js"></script>
</body>

<script src="script.js"></script>

</html>
